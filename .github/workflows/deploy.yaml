name: Spring Boot App Build And Deploy

on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: spring-boot-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setting up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build jar
        run: mvn clean package -DskipTests

      - name: Build Image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.Docker_IMAGE}}:latest .

      - name: Login Docker
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image Push
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.Docker_IMAGE}}:latest

      - name: Deploy On EC2
        uses: appleboy/ssh-action@v1
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER}}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker pull ${{secrets.DOCKER_USERNAME}}/${{env.Docker_IMAGE}}:latest
              docker stop sprin-boot-app || true
              docker rm sprin-boot-app || true
              docker run -d -p 8023:8023 --name spring-boot-app --restart unless-stopped ${{secrets.DOCKER_USERNAME}}/${{env.Docker_IMAGE}}:latest
              docker image prune -f
